[package]
name    = "lab-facil-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
# Web framework async sobre Tokio
axum              = { version = "0.7", features = ["macros"] }
tokio             = { version = "1",   features = ["full"] }
tower-http        = { version = "0.5", features = ["cors", "trace"] }

# Banco de dados async com queries verificadas em tempo de compilação
sqlx              = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "rust_decimal"] }

# Serialização / deserialização JSON
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"

# Autenticação
jsonwebtoken      = "9"
argon2            = "0.5"    # hash de senha, mais seguro que bcrypt

# Utilitários
chrono            = { version = "0.4", features = ["serde"] }
rust_decimal      = { version = "1",   features = ["serde-with-str"] }
uuid              = { version = "1",   features = ["v4"] }
dotenvy           = "0.15"
anyhow            = "1"
thiserror         = "1"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand              = "0.8"
printpdf          = "0.7"

[profile.release]
opt-level = 3
lto       = true        # link-time optimization → binário menor e mais rápido
codegen-units = 1
strip     = true        # remove símbolos de debug do binário final
