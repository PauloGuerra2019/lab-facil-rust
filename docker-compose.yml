version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET:-lab-facil-rust-chave-secreta-desenvolvimento-2026-super-segura}
      - CORS_ORIGIN=http://localhost:5173

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
